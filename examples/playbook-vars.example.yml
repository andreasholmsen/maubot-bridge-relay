# Relevant parts of a matrix-docker-ansible-deploy vars.yml for this setup.
# Variable names verified against the playbook in Sep 2026; check docs/ if something fails.

matrix_domain: matrix.example.com
matrix_server_fqn_matrix: matrix.example.com

# Private server: no federation, no web client, no E2EE in Element (bridges run unencrypted)
matrix_homeserver_federation_enabled: false
matrix_client_element_enabled: false
matrix_static_files_file_matrix_client_configuration_extension_json: |
  {
    "io.element.e2ee": {
      "force_disable": true
    }
  }

# Let's Encrypt via DNS-01 (server only reachable over Tailscale) - example: Domeneshop
traefik_config_certificatesResolvers_acme_dnsChallenge_enabled: true
traefik_config_certificatesResolvers_acme_dnsChallenge_provider: "domeneshop"
traefik_config_certificatesResolvers_acme_dnsChallenge_propagation_delayBeforeChecks: 60
traefik_config_certificatesResolvers_acme_dnsChallenge_resolvers:
  - "1.1.1.1:53"
  - "8.8.8.8:53"
traefik_environment_variables: |
  DOMENESHOP_API_TOKEN=CHANGE_ME
  DOMENESHOP_API_SECRET=CHANGE_ME

# Bridges + relay mode
matrix_bridge_mautrix_meta_messenger_enabled: true
matrix_bridge_mautrix_signal_enabled: true
matrix_bridges_relay_enabled: true
matrix_bridge_mautrix_signal_bridge_relay_admin_only: false
matrix_bridge_mautrix_meta_messenger_bridge_relay_admin_only: false

# Pass the relay bot's text through untouched (it adds "Name (Network): " itself).
# !unsafe stops Ansible from templating the Go-template braces.
matrix_bridge_mautrix_signal_configuration_extension_yaml: !unsafe |
  bridge:
    permissions:
      '@you:matrix.example.com': admin
    relay:
      message_formats:
        m.text: "{{ .Message }}"
        m.notice: "{{ .Message }}"
        m.image: "{{ .Caption }}"
        m.video: "{{ .Caption }}"
        m.file: "{{ .Caption }}"
        m.audio: "{{ .Caption }}"

matrix_bridge_mautrix_meta_messenger_configuration_extension_yaml: !unsafe |
  bridge:
    permissions:
      '@you:matrix.example.com': admin
    relay:
      message_formats:
        m.text: "{{ .Message }}"
        m.notice: "{{ .Message }}"
        m.image: "{{ .Caption }}"
        m.video: "{{ .Caption }}"
        m.file: "{{ .Caption }}"
        m.audio: "{{ .Caption }}"

# maubot
matrix_bot_maubot_enabled: true
matrix_bot_maubot_initial_password: "CHANGE_ME"
matrix_bot_maubot_admins:
  - yourname: "CHANGE_ME"
